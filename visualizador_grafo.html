<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bridge Intelligence — Grafo de Conocimiento Canónico</title>

  <style>
    :root {
      --bg: #090d16;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(51, 65, 85, 0.6);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .stats {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .stats span strong {
      color: #fff;
    }
    #app {
      display: flex;
      flex: 1;
      position: relative;
    }
    #network {
      flex: 1;
      height: 100%;
      background: radial-gradient(circle at center, #111827 0%, #090d16 100%);
    }
    .sidebar {
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
      z-index: 10;
      overflow-y: auto;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.5);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
    }
    .legend-item:hover, .legend-item.active {
      border-color: var(--border);
      background: rgba(51, 65, 85, 0.6);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .detail-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .detail-card h3 {
      font-size: 0.95rem;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .detail-card code {
      background: rgba(15, 23, 42, 0.7);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.78rem;
    }
    .controls {
      margin-top: auto;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 8px 12px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: var(--accent);
    }
  </style>
</head>

  <header>
    <div class="brand">
      <h1>BRIDGE — Grafo de Conocimiento</h1>
      <span class="badge">Canónico v1.0</span>
    </div>
    <div class="stats">
      <span>Nodos: <strong>102</strong></span>
      <span>Relaciones: <strong>76</strong></span>
      <span>Predicados: <strong>18</strong></span>
    </div>
  </header>

  <div id="app">
    <div id="network"></div>

    <aside class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar entidad (ej. CCO, CMF, Reputación)...">
      </div>

      <div class="legend">
        <div class="legend-title">Tipos de Entidad</div>
        <div class="legend-items" id="legendContainer"></div>
      </div>

      <div class="detail-card" id="detailCard">
        <h3>Detalles de Selección</h3>
        <p style="color: var(--muted);">Haz clic en un nodo o relación para inspeccionar sus atributos, predicados y evidencias de respaldo.</p>
      </div>

      <div class="controls">
        <button class="btn" id="btnFit">Centrar Grafo</button>
        <button class="btn" id="btnPhysics">Pausar Física</button>
      </div>
    </aside>
  </div>

    const coloresTipo = {"rol": {"background": "#8b5cf6", "border": "#6d28d9", "highlight": "#a78bfa"}, "org": {"background": "#3b82f6", "border": "#1d4ed8", "highlight": "#60a5fa"}, "riesgo": {"background": "#ef4444", "border": "#b91c1c", "highlight": "#f87171"}, "tema": {"background": "#10b981", "border": "#047857", "highlight": "#34d399"}, "doc": {"background": "#f59e0b", "border": "#b45309", "highlight": "#fbbf24"}, "comp": {"background": "#6366f1", "border": "#4338ca", "highlight": "#818cf8"}, "prod": {"background": "#06b6d4", "border": "#0e7490", "highlight": "#22d3ee"}, "exp": {"background": "#ec4899", "border": "#be185d", "highlight": "#f472b6"}, "met": {"background": "#14b8a6", "border": "#0f766e", "highlight": "#2dd4bf"}, "req": {"background": "#84cc16", "border": "#4d7c0f", "highlight": "#a3e635"}, "entidad": {"background": "#64748b", "border": "#334155", "highlight": "#94a3b8"}};

    const nodes = new vis.DataSet(rawNodes);
    const edges = new vis.DataSet(rawEdges);

    const container = document.getElementById('network');
    const data = { nodes: nodes, edges: edges };
    const options = {
      nodes: {
        borderWidth: 2,
        shadow: { enabled: true, color: 'rgba(0,0,0,0.5)', size: 8 }

      edges: {
        width: 1.5,
        shadow: { enabled: false },
        selectionWidth: 3
      },
      physics: {
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: -40,
          centralGravity: 0.008,
          springLength: 95,
          springConstant: 0.08,
          damping: 0.4
        },
        stabilization: { iterations: 150 }
      },
      interaction: {
        hover: true,
        tooltipDelay: 100,
        navigationButtons: true,
        keyboard: true
      }
    };

    const network = new vis.Network(container, data, options);

    // Poblar leyenda
    const legendContainer = document.getElementById('legendContainer');
    const tipos = [...new Set(rawNodes.map(n => n.tipo))].sort();
    tipos.forEach(tipo => {
      const color = coloresTipo[tipo] || coloresTipo['entidad'];
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="dot" style="background:${color.background}"></span> ${tipo}`;
      item.onclick = () => {
        const matchingIds = rawNodes.filter(n => n.tipo === tipo).map(n => n.id);
        network.selectNodes(matchingIds);
      };
      legendContainer.appendChild(item);
    });

    // Detalle al hacer clic
    const detailCard = document.getElementById('detailCard');
    network.on('click', function(params) {
      if (params.nodes.length > 0) {
        const nid = params.nodes[0];
        const n = rawNodes.find(item => item.id === nid);
        const connectedEdges = rawEdges.filter(e => e.from === nid || e.to === nid);
        detailCard.innerHTML = `
          <h3>${n.canonical_name}</h3>
          <p><strong>ID:</strong> <code>${n.id}</code></p>
          <p><strong>Tipo:</strong> <span class="badge" style="background:${n.color.background}; color:#fff">${n.tipo}</span></p>
          <p style="margin-top:8px;"><strong>Relaciones conectadas (${connectedEdges.length}):</strong></p>
          <ul style="padding-left:16px; margin-top:4px; font-size:0.75rem; color:var(--muted)">
            ${connectedEdges.map(e => `<li><strong>${e.label}</strong>: ${e.from === nid ? e.to : e.from}</li>`).join('')}
          </ul>
        `;
      } else if (params.edges.length > 0) {
        const eid = params.edges[0];
        const e = rawEdges.find(item => item.id === eid);
        detailCard.innerHTML = `
          <h3>Relación: ${e.label}</h3>
          <p><strong>Sujeto:</strong> <code>${e.from}</code></p>
          <p><strong>Objeto:</strong> <code>${e.to}</code></p>
          <div style="margin-top:8px; font-size:0.75rem; color:var(--muted)">${e.title}</div>
        `;
      }
    });

    // Búsqueda
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        network.unselectAll();
        return;
      }
      const match = rawNodes.find(n => n.canonical_name.toLowerCase().includes(query) || n.id.toLowerCase().includes(query));
      if (match) {
        network.selectNodes([match.id]);
        network.focus(match.id, { scale: 1.2, animation: true });
      }
    });

    document.getElementById('btnFit').onclick = () => network.fit({ animation: true });

    document.getElementById('btnPhysics').onclick = (e) => {
